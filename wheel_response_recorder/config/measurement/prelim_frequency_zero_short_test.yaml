# NOTE(SuperJappie08): Short measurement cycle for testing purposes
response_director:
  ros__parameters:
    parameter_prefix: sinusoid
    arguments: [amplitude, frequency, phase, offset]
    signal:
      amplitude:
        kind: fixed
        # This is to low for the original hardware setup
        value: 4.5
      frequency:
        kind: log
        start: -2.0
        stop: 1.0
        num_steps: 4
      phase:
        kind: fixed
        value: 0.0
      offset:
        kind: linear
        start: 0.0
        stop: 2.0
        num_steps: 2
