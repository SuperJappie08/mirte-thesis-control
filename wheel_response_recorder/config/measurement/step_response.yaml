response_director:
  ros__parameters:
    parameter_prefix: step
    arguments: [initial_commmand, step_command, t_step]
    measurement_duration_modifier: "t_step + measurement_duration"
    signal:
      initial_commmand:
        kind: fixed
        value: 0.0
      step_command:
        kind: list
        values:
        # 5 x 3.0 ~ 5 x -3.0
          - 3.0
          - -3.0
          - 3.0
          - -3.0
          - 3.0
          - -3.0
          - 3.0
          - -3.0
          - 3.0
          - -3.0
          # 5 x 4.5 ~ 5 x -4.5
          - 4.5
          - -4.5
          - 4.5
          - -4.5
          - 4.5
          - -4.5
          - 4.5
          - -4.5
          - 4.5
          - -4.5
          # Close to Max
          # 5 x 21 ~ 5 x -21
          - 21.0
          - -21.0
          - 21.0
          - -21.0
          - 21.0
          - -21.0
          - 21.0
          - -21.0
          - 21.0
          - -21.0
      t_step:
        kind: fixed
        value: 2.0
