response_director:
  ros__parameters:
    parameter_prefix: sinusoid
    arguments: [amplitude, frequency, phase, offset]
    signal:
      amplitude:
        kind: fixed
        value: 2.5
      frequency:
        kind: log
        start: -2.0
        stop: 3.0
        # For nice points: (stop-start + 1) + (stop - start)*X
        # For nice points: 1 + (stop - start)*X
        num_steps: 51
      phase:
        kind: fixed
        value: 0.0
      offset:
        kind: fixed
        value: 4.5
