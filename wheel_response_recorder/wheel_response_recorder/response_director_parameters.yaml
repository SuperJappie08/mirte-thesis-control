response_director:
  controller_name:
    type: string
    default_value: ""
    description: "The name of the controller to measure"
    read_only: true
    validation:
      not_empty<>: null

  storage_location:
    type: string
    description: "Save location for the measurements folder"
    read_only: true
    validation:
      not_empty<>: null

  measurement_duration:
    type: double
    default_value: 5.0
    description: "Howlong to measure at each configuration point in seconds"
    read_only: true
    validation:
      gt<>: 0.0

  manual_mode:
    type: bool
    default_value: false
    description: >-
      When enabling manual mode a continue service must be called to start the measurement.
      (Useful for ground measumerents)
    read_only: true

  # This is going to be an unsafe use of eval, but doing this differently would be difficult
  measurement_duration_modifier:
    type: string
    default_value: "max(measurement_duration, 2 / frequency)"
    description: A Python expression which should return the measurement duration. If only using measurement duration use 'measurement_duration'
    validation:
      not_empty<>: null

  node_timeout:
    type: double
    default_value: .INF
    description: "Howlong to wait for nodes to be available (.INF is infinite)"
    read_only: true

  wait_for_telemetrix:
    type: bool
    default_value: true
    description: "If the recorder will wait for the telemetrix node to be available"
    read_only: true

  progressbar:
    type: bool
    default_value: False
    description: "Enable a progressbar"
    read_only: true

  recorded_services:
    type: string_array
    default_value: []
    description: "Services to record"
    read_only: true
    validation:
      unique<>: null

  recorded_topics:
    type: string_array
    default_value: []
    description: "Extra topics to record"
    read_only: true
    validation:
      unique<>: null

  extra_notes:
    type: string
    default_value: ""
    description: "Extra notes about the measurement"
    read_only: true

  parameter_prefix:
    type: string
    default_value: "sinusoid"
    description: "The parameter prefix for the iterated parameters."
    read_only: true

  arguments:
    type: string_array
    default_value: ["offset", "amplitude", "frequency", "phase"]
    description: "The available signal producer parameters (configured under signal.{arguments}.*)"
    read_only: true
    validation:
      unique<>: null
      not_empty<>: null
  signal:
    __map_arguments:
      kind:
        type: string
        read_only: true
        validation:
          not_empty<>: null
          one_of<>: [["fixed", "linear", "log", "list"]]
      value:
        type: double
        default_value: .NAN
        description: "The fixed value when the amplitude kind is 'fixed'"
        read_only: true
        # validation:
        #   "custom_validators::gt_or_nan": 0.0
      start:
        type: double
        default_value: .NAN
        description: "The start value when the kind is 'linear' or 'log'. (When 'log' this is an exponent of 'base')"
        read_only: true
      stop:
        type: double
        default_value: .NAN
        description: "The (inclusive) stop value when the kind is 'linear' or 'log'. (When 'log' this is an exponent of 'base')"
        read_only: true
      num_steps:
        type: int
        default_value: 0
        description: "The number of steps when the kind is 'linear' or 'log'"
        read_only: true
        validation:
          gt_eq<>: 0
      base:
        type: double
        default_value: 10.0
        description: "The base of the exponent when kind is 'log'"
        validation:
          gt<>: 0.0
      values:
        type: double_array
        default_value: [.NAN]
        description: "List of values to iterate over when the kind is 'list'"
        read_only: true
        validation:
          "custom_validators::single_nan_or_normals": null

  # amplitude:
  #   kind:
  #     type: string
  #     read_only: true
  #     validation:
  #       not_empty<>: null
  #       one_of<>: [["fixed",]]
