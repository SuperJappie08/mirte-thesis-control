name: CI mirte-thesis-control

on: [push, pull_request]

jobs:
  ament_lint:
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-${{ matrix.ubuntu }}-ros-${{ matrix.ros_distro }}-ros-base-latest
    strategy:
      fail-fast: false
      matrix:
        package: [wheel_response_controller, wheel_response_recorder, thesis_data_processing]
        linter: [xmllint, copyright, pep257, flake8]
        ros_distro: [jazzy]
        include:
          - ros_distro: jazzy
            ubuntu: noble
          - ros_distro: jazzy
            package: wheel_response_recorder
            linter: mypy
            # linter: [ lint_cmake]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup ROS environment
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}
      - name: Run Linter
        env:
          AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: 1
        uses: ros-tooling/action-ros-lint@v0.1
        with:
          linter: ${{ matrix.linter }}
          distribution: ${{ matrix.ros_distro }}
          package-name: ${{ matrix.package }}
  build_and_test:
    runs-on: ubuntu-24.04
    needs: ament_lint

    strategy:
      matrix:
        ros_distro: [jazzy]
    steps:
      - name: Setup ROS (${{ matrix.ros_distro }})
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}
      - name: Build and run tests
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: |
            wheel_response_controller
            wheel_response_recorder
            thesis_data_processing
          target-ros2-distro: ${{ matrix.ros_distro }}
